name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Apache module
        run: |
          if ! grep -q 'Apache License' LICENSE; then
            echo "open_driver must stay Apache 2.0"
            exit 1
          fi
          if git remote -v | grep -q 'gitlab.com/apito.io/engine'; then
            echo "refusing a private engine checkout"
            exit 1
          fi
          go test ./...
